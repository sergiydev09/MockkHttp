name: mockk_http
description: >-
  In-app HTTP interceptor for Flutter: sends dio, HttpClient and package:http traffic to t
  he MockkHttp IDE plugin to record, debug and mock responses, also from AI agents over MCP.
version: 1.8.0
homepage: https://github.com/sergiydev09/MockkHttp
repository: https://github.com/sergiydev09/MockkHttp/tree/main/flutter-package

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  dio: ">=5.0.0 <6.0.0"

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
